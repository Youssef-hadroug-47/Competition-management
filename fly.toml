app = "tournly"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_SSL = "true"
  DATABASE_SSL_REJECT_UNAUTHORIZED = "true"
  DATABASE_POOL_MAX = "5"
  PERFORMANCE_LOGGING = "false"
  # Set CORS_ORIGINS as a Fly secret after creating the Vercel frontend.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"
