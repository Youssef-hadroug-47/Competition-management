<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex, nofollow" />
<title>Choose a new password — Tournly</title>
<!-- Icon inspired by https://www.flaticon.com/free-icons/soccer -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' http://localhost:* https:; img-src 'self' data:; object-src 'none'; base-uri 'self'; " />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="logo" href="/index"><span class="logo__mark" aria-hidden="true"></span>Tournly</a>
  </header>
  <div class="auth-shell">
    <main class="auth-card verify-card">
      <div class="verify-card__icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" focusable="false">
          <rect x="10" y="21" width="28" height="19" rx="4"></rect>
          <path d="M16 21v-5a8 8 0 0 1 16 0v5"></path>
          <circle cx="24" cy="30" r="2.5"></circle>
        </svg>
      </div>
      <p class="verify-card__eyebrow">Account recovery</p>
      <h1 id="reset-title">Choose a new password</h1>
      <p id="reset-intro" class="verify-card__intro">Choose a strong password you haven’t used before.</p>

      <div id="banner" class="banner" hidden role="alert"></div>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="new-password">New password</label>
          <input id="new-password" name="password" type="password" required minlength="8" autocomplete="new-password" />
          <span class="field__hint">At least 8 characters.</span>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input id="confirm-password" name="confirm" type="password" required minlength="8" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn--primary" id="submit-btn" style="width:100%;">Update password</button>
      </form>

      <section id="reset-success" class="registration-verified" aria-live="polite" hidden>
        <span class="registration-verified__icon" aria-hidden="true">✓</span>
        <h2>Password updated</h2>
        <p>Sign in with your new password.</p>
        <a class="btn btn--primary" href="/login">Continue to sign in</a>
      </section>

      <p id="reset-help" class="verify-card__help" hidden><a href="/forgot-password">Request a new reset link</a></p>
      <a class="verify-card__signin" href="/login">Back to sign in</a>
    </main>
  </div>
  <footer class="page__footer">Tournly — a small tournament organizer.</footer>
</div>
<script src="/js/config.js"></script>
<script src="/js/session.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/page-activity.js"></script>
<script src="/js/api.js"></script>
<script src="/js/reset-password.js"></script>
</body>
</html>
