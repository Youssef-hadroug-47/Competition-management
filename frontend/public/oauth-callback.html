<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Completing sign-in — Tournly</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; script-src 'self'; connect-src 'self' http://localhost:* https:; img-src 'self' data:; object-src 'none'; base-uri 'self'; " />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="logo" href="/index"><span class="logo__mark" aria-hidden="true"></span>Tournly</a>
  </header>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="oauth-title">
      <h1 id="oauth-title">Completing sign-in</h1>
      <p id="oauth-status" role="status" aria-live="polite">Securely connecting your Google account to Tournly…</p>
      <div id="banner" class="banner" hidden role="alert"></div>
      <a id="oauth-continue" class="btn btn--primary" href="/login" hidden>Return to sign in</a>
    </section>
  </main>
  <footer class="page__footer">Tournly — a small tournament organizer.</footer>
</div>
<script src="/js/config.js"></script>
<script src="/js/session.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/api.js"></script>
<script src="/js/oauth-callback.js"></script>
</body>
</html>
