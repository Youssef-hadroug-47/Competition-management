<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex, nofollow" />
<title>Forgot password — Tournly</title>
<!-- Icon inspired by https://www.flaticon.com/free-icons/soccer -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' http://localhost:* https:; img-src 'self' data:; object-src 'none'; base-uri 'self'; " />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="logo" href="/index"><span class="logo__mark" aria-hidden="true"></span>Tournly</a>
  </header>

  <div class="auth-shell">
    <div class="auth-card">
      <h1>Forgot your password?</h1>
      <p>Enter the email address for your account and we’ll send you a link to choose a new password.</p>

      <div id="banner" class="banner" hidden role="alert"></div>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="forgot-email">Email</label>
          <input id="forgot-email" name="email" type="email" required autocomplete="email" />
        </div>
        <button type="submit" class="btn btn--primary" id="submit-btn" style="width:100%;">Send reset link</button>
      </form>

      <section id="forgot-success" class="registration-verified" aria-live="polite" hidden>
        <span class="registration-verified__icon" aria-hidden="true">✓</span>
        <h2>Check your email</h2>
        <p id="forgot-success-message">If an account exists for that address, a password reset link has been sent.</p>
        <a class="btn btn--secondary" href="/login">Back to sign in</a>
      </section>

      <p class="auth-card__switch"><a href="/login">Back to sign in</a></p>
    </div>
  </div>

  <footer class="page__footer">Tournly — a small tournament organizer.</footer>
</div>
<script src="/js/config.js"></script>
<script src="/js/session.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/page-activity.js"></script>
<script src="/js/api.js"></script>
<script src="/js/forgot-password.js"></script>
</body>
</html>
